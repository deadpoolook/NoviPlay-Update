name: Diagnostico

on:
  workflow_dispatch:

jobs:
  teste:
    runs-on: windows-latest
    steps:
      - name: Ver o que chegou
        shell: pwsh
        run: |
          Write-Host "--- variaveis de ambiente NOVIPLAY_* ---"
          Get-ChildItem Env: | Where-Object { $_.Name -like 'NOVIPLAY*' } | ForEach-Object {
            $v = $_.Value
            if ($v.Length -gt 6) { $v = $v.Substring(0,3) + '...' + $v.Substring($v.Length-3) }
            Write-Host "  $($_.Name) = $v"
          }
          if (-not (Get-ChildItem Env: | Where-Object { $_.Name -like 'NOVIPLAY*' })) {
            Write-Host "  (nenhuma variavel NOVIPLAY*)"
          }
          Write-Host ""
          Write-Host "--- usando a sintaxe secrets.X ---"
          Write-Host "  NOVIPLAY_GIST_ID   definido? $([bool]$env:NOVIPLAY_GIST_ID)"
          $directo = '${{ secrets.NOVIPLAY_GIST_ID }}'
          Write-Host "  via expressao       : $directo"